function useCollection(name, defaultValue, enabled) {
  const [data, setData] = useState(defaultValue);
  useEffect(() => {
    if (!enabled) return;
    const unsub = db.collection(name).onSnapshot(snap => setData(snap.docs.map(d => ({
      id: d.id,
      ...d.data()
    }))), err => console.error(name, err.message));
    return unsub;
  }, [name, enabled]);
  return data;
}

    return unsub;
  }, [path, enabled]);
  return data;
}
async function clearCollection(name, docs) {
  for (let i = 0; i < docs.length; i += 400) {
    const chunk = docs.slice(i, i + 400);
    const batch = db.batch();
    chunk.forEach(d => batch.delete(db.collection(name).doc(d.id)));
    await batch.commit();
  }
}
